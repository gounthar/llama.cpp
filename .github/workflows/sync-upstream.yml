name: Sync upstream

on:
  schedule:
    - cron: '0 5 * * *'   # Daily at 05:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and merge
        id: merge
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream."
          else
            if git merge upstream/master --no-edit; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Push to fork
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:master

      - name: Open issue on conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = 'Upstream sync conflict';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
            });
            if (issues.length > 0) {
              console.log('Conflict issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The daily upstream sync failed due to merge conflicts.',
                '',
                '**Upstream**: `ggml-org/llama.cpp` `master`',
                `**Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please resolve manually:',
                '```bash',
                'git fetch upstream master',
                'git merge upstream/master',
                '# fix conflicts',
                'git push origin master',
                '```',
              ].join('\n'),
              labels: ['sync-conflict'],
            });
