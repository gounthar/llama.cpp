name: Sync upstream

on:
  schedule:
    - cron: '0 5 * * *'   # Daily at 05:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and merge
        id: merge
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream."
          else
            if git merge upstream/master --no-edit; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Push to fork
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:master

      - name: Report conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        run: |
          {
            echo "## Upstream sync conflict"
            echo ""
            echo "The daily upstream sync failed due to merge conflicts."
            echo ""
            echo "**Upstream**: \`ggml-org/llama.cpp\` \`master\`"
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            run_url="${run_url}/actions/runs/${GITHUB_RUN_ID}"
            echo "**Run**: ${run_url}"
            echo ""
            echo "Resolve manually:"
            echo '```bash'
            echo "git fetch upstream master"
            echo "git merge upstream/master"
            echo "# fix conflicts"
            echo "git push origin master"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync conflict — see job summary."
          exit 1
